name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: cargo-deny
        run: |
          cargo install --locked cargo-deny || true
          cargo deny check

  contracts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-openai-fixtures.sh
      - run: npx -y @redocly/cli lint contracts/pocket-api.yaml
      - run: npx -y ajv-cli validate -s contracts/events.schema.json -d "contracts/events/*.example.json"

  xcframework:
    runs-on: macos-15
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/build-xcframework.sh
      - run: swift test
      - run: xcodebuild -scheme PocketKit -destination 'generic/platform=iOS' build
      - run: xcodebuild -scheme PocketUI -destination 'generic/platform=iOS' build
