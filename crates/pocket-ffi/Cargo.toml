[package]
name = "pocket-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "pocket_ffi"

[dependencies]
pocket-types = { path = "../pocket-types" }
pocket-engine = { path = "../pocket-engine" }
pocket-store = { path = "../pocket-store" }
pocket-models = { path = "../pocket-models" }
pocket-audit = { path = "../pocket-audit" }
pocket-trust = { path = "../pocket-trust" }
pocket-server = { path = "../pocket-server" }
thiserror = { workspace = true }
tokio = { workspace = true }
uniffi = { workspace = true }
ed25519-dalek = "3"
ulid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
tokio-stream = "0.1"
futures-util = "0.3"
sha2 = "0.10"
getrandom = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
